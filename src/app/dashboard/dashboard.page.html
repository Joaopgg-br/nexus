<ion-content [fullscreen]="true"
             [scrollY]="true"
             [scrollX]="false"
             class="dashboard-content">

  <!-- Header / Saudação -->
  <div class="dashboard-header">
    <div class="greeting">
      <h2 class="greeting-text">Olá 👋</h2>
      <h1 class="greeting-name">Aluno</h1>
    </div>
    <div class="avatar">
      <img src="assets/perfil.png" alt="Avatar" />
    </div>
  </div>

  <!-- Barra de Pesquisa -->
  <div class="search-section">
    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        type="text"
        placeholder="Buscar curso ou categoria"
        class="search-input"
        [(ngModel)]="termoBusca"
      />
    </div>
  </div>

  <!-- Carrossel infinito de parceiros -->
  <div class="partners-wrapper">
    <div class="partners-track">
      <img src="assets/microsoft.png" alt="Microsoft" />
      <img src="assets/google.png" alt="Google" />
      <img src="assets/adobe.png" alt="Adobe" />
      <img src="assets/senai.png" alt="SENAI" />
      <img src="assets/sesi.jpg" alt="SESI" />
      <!-- Cópia para loop contínuo -->
      <img src="assets/microsoft.png" alt="Microsoft" />
      <img src="assets/google.png" alt="Google" />
      <img src="assets/adobe.png" alt="Adobe" />
      <img src="assets/senai.png" alt="SENAI" />
      <img src="assets/sesi.jpg" alt="SESI" />
    </div>
  </div>

  <!-- Scroll horizontal de cursos -->
  <div class="courses-section">
    <div class="courses-scroll" #coursesScroll
         (touchstart)="$event.stopPropagation()"
         (mousedown)="$event.stopPropagation()">

      <ion-card
        class="course-card"
        *ngFor="let curso of cursosFiltrados"
        (click)="abrirCurso(curso.id)"
      >
        <div class="course-thumbnail" [ngClass]="curso.corThumb">
          <img [src]="curso.imagem" [alt]="curso.titulo" />
          <div class="course-duration" *ngIf="curso.duracao">{{ curso.duracao }}</div>
        </div>
        <ion-card-content>
          <p class="course-category">{{ curso.categoria }}</p>
          <h3 class="course-title">{{ curso.titulo }}</h3>
        </ion-card-content>
      </ion-card>

      <p class="empty-state" *ngIf="cursosFiltrados.length === 0">
        Nenhum curso encontrado.
      </p>

    </div>
  </div>

</ion-content>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="nav-item active" (click)="irHome()">
    <div class="nav-home-btn">
      <ion-icon name="home"></ion-icon>
    </div>
  </button>
  <button class="nav-item" (click)="abrirCurso(1)">
    <ion-icon name="pie-chart-outline"></ion-icon>
  </button>
  <button class="nav-item" (click)="abrirPerfil()">
    <ion-icon name="time-outline"></ion-icon>
  </button>
  <button class="nav-item">
    <ion-icon name="notifications-outline"></ion-icon>
  </button>
</div>
