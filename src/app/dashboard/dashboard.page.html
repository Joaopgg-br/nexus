<ion-content [fullscreen]="true"
             [scrollY]="true"
             [scrollX]="false"
             class="dashboard-content">

  <!-- Header / Saudação -->
  <div class="dashboard-header">
    <div class="greeting">
      <h2 class="greeting-text">Olá 👋</h2>
      <h1 class="greeting-name">Aluno</h1>
    </div>
    <div class="avatar">
      <img src="assets/perfil.png" alt="Avatar" />
    </div>
  </div>

  <!-- Barra de Pesquisa -->
  <div class="search-section">
    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        type="text"
        placeholder="Buscar curso ou categoria"
        class="search-input"
        [(ngModel)]="termoBusca"
      />
    </div>
  </div>

  <!-- Carrossel infinito de parceiros -->
  <div class="partners-wrapper">
    <div class="partners-track">
      <img src="assets/microsoft.png" alt="Microsoft" />
      <img src="assets/google.png" alt="Google" />
      <img src="assets/adobe.png" alt="Adobe" />
      <img src="assets/senai.png" alt="SENAI" />
      <img src="assets/sesi.jpg" alt="SESI" />
      <!-- Cópia para loop contínuo -->
      <img src="assets/microsoft.png" alt="Microsoft" />
      <img src="assets/google.png" alt="Google" />
      <img src="assets/adobe.png" alt="Adobe" />
      <img src="assets/senai.png" alt="SENAI" />
      <img src="assets/sesi.jpg" alt="SESI" />
    </div>
  </div>

  <!-- Scroll horizontal de cursos -->
  <div class="courses-section">
    <div class="courses-scroll" #coursesScroll
         (touchstart)="$event.stopPropagation()"
         (mousedown)="$event.stopPropagation()">

      <ion-card
        class="course-card"
        *ngFor="let curso of cursosFiltrados"
        (click)="abrirCurso()"
      >
        <div class="course-thumbnail" [ngClass]="curso.corThumb">
          <img [src]="curso.imagem" [alt]="curso.titulo" />
          <div class="course-duration" *ngIf="curso.duracao">{{ curso.duracao }}</div>
        </div>
        <ion-card-content>
          <p class="course-category">{{ curso.categoria }}</p>
          <h3 class="course-title">{{ curso.titulo }}</h3>
        </ion-card-content>
      </ion-card>

      <p class="empty-state" *ngIf="cursosFiltrados.length === 0">
        Nenhum curso encontrado.
      </p>

    </div>
  </div>

</ion-content>

<<!-- Bottom Navigation -->
<div class="bottom-nav">

  <!-- HOME -->
  <button
    class="nav-item"
    [class.active]="paginaAtual === 'home'"
    (click)="irHome()">

    <div
      class="nav-home-btn"
      *ngIf="paginaAtual === 'home'">

      <ion-icon name="home"></ion-icon>

    </div>

    <ion-icon
      *ngIf="paginaAtual !== 'home'"
      name="home-outline">
    </ion-icon>

  </button>


  <!-- CURSOS -->
  <button
    class="nav-item"
    [class.active]="paginaAtual === 'cursos'"
    (click)="abrirCursos()">

    <div
      class="nav-home-btn"
      *ngIf="paginaAtual === 'cursos'">

      <ion-icon name="pie-chart"></ion-icon>

    </div>

    <ion-icon
      *ngIf="paginaAtual !== 'cursos'"
      name="pie-chart-outline">
    </ion-icon>

  </button>


  <!-- HISTÓRICO -->
  <button
    class="nav-item"
    [class.active]="paginaAtual === 'historico'"
    (click)="abrirHistorico()">

    <div
      class="nav-home-btn"
      *ngIf="paginaAtual === 'historico'">

      <ion-icon name="time"></ion-icon>

    </div>

    <ion-icon
      *ngIf="paginaAtual !== 'historico'"
      name="time-outline">
    </ion-icon>

  </button>


  <!-- NOTIFICAÇÕES -->
  <button
    class="nav-item"
    [class.active]="paginaAtual === 'notificacoes'"
    (click)="abrirNotificacoes()">

    <div
      class="nav-home-btn"
      *ngIf="paginaAtual === 'notificacoes'">

      <ion-icon name="notifications"></ion-icon>

    </div>

    <ion-icon
      *ngIf="paginaAtual !== 'notificacoes'"
      name="notifications-outline">
    </ion-icon>

  </button>

</div>
