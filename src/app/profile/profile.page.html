<ion-content
  [fullscreen]="true"
  class="profile-content"
>
  <div
    class="profile-loading"
    *ngIf="carregando"
  >
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ng-container *ngIf="!carregando">
    <div class="profile-avatar-top">
      <img
        [src]="fotoPerfil"
        (error)="usarAvatarPadrao()"
        alt="Avatar do usuário"
      />
    </div>

    <div class="profile-card">
      <div class="account-heading">
        <h1 *ngIf="nome">{{ nome }}</h1>
        <p>{{ statusConta }}</p>
      </div>

      <div class="form-group">
        <label for="profile-name">Nome</label>
        <input
          id="profile-name"
          type="text"
          [(ngModel)]="nome"
          placeholder="Adicione seu nome"
          class="profile-input"
        />
      </div>

      <div class="form-group">
        <label for="profile-email">E-mail</label>
        <input
          id="profile-email"
          type="email"
          [value]="email"
          class="profile-input readonly"
          readonly
        />
        <small>
          O e-mail pertence à conta autenticada.
        </small>
      </div>

      <div class="form-group">
        <label for="profile-avatar">
          URL do avatar (opcional)
        </label>
        <input
          id="profile-avatar"
          type="url"
          [(ngModel)]="avatarUrl"
          placeholder="https://..."
          class="profile-input"
        />
      </div>

      <p
        class="profile-message success"
        *ngIf="mensagem"
      >
        {{ mensagem }}
      </p>

      <p
        class="profile-message error"
        *ngIf="mensagemErro"
      >
        {{ mensagemErro }}
      </p>

      <button
        type="button"
        class="save-button"
        [disabled]="salvando"
        (click)="salvarPerfil()"
      >
        {{
          salvando
            ? 'Salvando...'
            : 'Salvar perfil'
        }}
      </button>

      <button
        type="button"
        class="logout-button"
        (click)="sair()"
      >
        <ion-icon name="log-out-outline"></ion-icon>
        Sair da conta
      </button>
    </div>
  </ng-container>
</ion-content>

<app-tab-bar></app-tab-bar>
