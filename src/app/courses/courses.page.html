<ion-content
  [fullscreen]="true"
  class="course-content"
>
  <div
    class="course-header"
    [ngClass]="curso.corTema"
  >
    <div class="header-top">
      <button
        type="button"
        class="icon-btn"
        (click)="voltar()"
        aria-label="Voltar ao dashboard"
      >
        <ion-icon name="arrow-back"></ion-icon>
      </button>
    </div>

    <img
      [src]="curso.imagem"
      [alt]="curso.nome"
      class="header-img"
    />
  </div>

  <div class="course-body">
    <h1 class="course-title">
      {{ curso.nome }}
    </h1>

    <div class="course-meta">
      <span class="course-tag">
        {{ curso.categoria }}
      </span>
      <span class="course-rating">
        <ion-icon name="star"></ion-icon>
        {{ curso.nota }}
        ({{ curso.avaliacoes }} avaliações)
      </span>
    </div>

    <p class="course-description">
      {{ curso.descricao }}
    </p>

    <div class="course-info-chips">
      <div class="info-chip">
        <ion-icon
          [name]="curso.gratis
            ? 'lock-open-outline'
            : 'lock-closed-outline'"
        ></ion-icon>
        <span>
          {{ curso.gratis ? 'Grátis' : 'Pago' }}
        </span>
      </div>

      <div class="info-chip">
        <ion-icon name="time-outline"></ion-icon>
        <span>{{ curso.cargaHoraria }}</span>
      </div>

      <div class="info-chip">
        <ion-icon name="bar-chart-outline"></ion-icon>
        <span>{{ curso.nivel }}</span>
      </div>

      <div class="info-chip">
        <ion-icon name="flask-outline"></ion-icon>
        <span>{{ curso.laboratorios }} Labs</span>
      </div>
    </div>

    <div class="lesson-list">
      <button
        type="button"
        class="lesson-item"
        *ngFor="let aula of curso.aulas"
        [disabled]="aula.bloqueada"
        (click)="abrirAula(aula)"
      >
        <div
          class="lesson-icon"
          [class.locked]="aula.bloqueada"
        >
          <ion-icon
            [name]="aula.concluida
              ? 'checkmark-circle'
              : aula.bloqueada
                ? 'lock-closed'
                : 'play'"
          ></ion-icon>
        </div>

        <div class="lesson-info">
          <h3>{{ aula.titulo }}</h3>
          <p>
            {{ aula.capitulo }}
            <span class="dot">•</span>
            {{ aula.duracao }}
          </p>
        </div>
      </button>
    </div>

    <button
      type="button"
      class="quiz-final-card"
      *ngIf="curso.quizLiberado"
      (click)="abrirQuiz()"
    >
      <div class="quiz-final-icon">
        <ion-icon
          name="document-text-outline"
        ></ion-icon>
      </div>

      <div class="quiz-final-info">
        <h3>Quiz Final</h3>
        <p>
          Teste seus conhecimentos sobre cibersegurança
        </p>
      </div>

      <ion-icon
        name="arrow-forward-outline"
        class="quiz-arrow"
      ></ion-icon>
    </button>

    <button
      type="button"
      class="start-course-btn"
      (click)="comecarCurso()"
    >
      Começar curso
    </button>
  </div>
</ion-content>

<app-tab-bar></app-tab-bar>
