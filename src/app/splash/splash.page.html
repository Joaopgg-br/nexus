<ion-content [fullscreen]="true" [scrollY]="false" class="splash">
  <div class="splash-stage">
    <p class="eyebrow">APRENDA. CONECTE. EVOLUA.</p>
    <div class="brand">
      <div class="emblem" aria-hidden="true">
        <div class="orbit orbit-outer"></div>
        <div class="orbit orbit-inner"></div>
        <div class="logo-tile">
          <ion-icon name="compass-outline"></ion-icon>
        </div>
        <span class="spark spark-blue"></span>
        <span class="spark spark-purple"></span>
      </div>
      <h1>Nexus<span aria-hidden="true">.</span></h1>
      <p class="tagline">Seu próximo passo<br>começa aqui.</p>
    </div>
    <div class="loading" role="status" aria-live="polite">
      <div class="loading-track" aria-hidden="true"><span></span></div>
      <p>Preparando seu espaço</p>
    </div>
  </div>
</ion-content>
