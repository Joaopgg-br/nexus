<ion-content
  [fullscreen]="true"
  class="lesson-content"
  *ngIf="aula"
>
  <div class="lesson-header">
    <button
      type="button"
      class="icon-btn"
      (click)="voltar()"
    >
      <ion-icon name="arrow-back"></ion-icon>
    </button>
    <span class="course-name">
      {{ curso.nome }}
    </span>
  </div>

  <div
    class="video-wrapper"
    *ngIf="videoSeguro"
  >
    <iframe
      [src]="videoSeguro"
      frameborder="0"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>

  <div class="lesson-body">
    <p class="lesson-chapter">
      {{ aula.capitulo }}
      <span class="dot">•</span>
      {{ aula.duracao }}
    </p>

    <h1 class="lesson-title">
      {{ aula.titulo }}
    </h1>

    <div class="lesson-text">
      <p>{{ aula.textoConteudo }}</p>
    </div>

    <div class="lesson-nav">
      <button
        type="button"
        class="nav-btn secondary"
        [disabled]="!temAulaAnterior()"
        (click)="aulaAnterior()"
      >
        <ion-icon
          name="chevron-back-outline"
        ></ion-icon>
        Anterior
      </button>

      <button
        type="button"
        class="nav-btn secondary"
        [disabled]="!temProximaAula()"
        (click)="proximaAula()"
      >
        Próxima
        <ion-icon
          name="chevron-forward-outline"
        ></ion-icon>
      </button>
    </div>

    <p
      class="lesson-error"
      *ngIf="mensagemErro"
    >
      {{ mensagemErro }}
    </p>

    <button
      type="button"
      class="complete-btn"
      [disabled]="aula.concluida"
      (click)="marcarConcluida()"
    >
      <ion-icon
        name="checkmark-circle-outline"
      ></ion-icon>
      {{
        aula.concluida
          ? 'Aula concluída'
          : 'Marcar como concluída'
      }}
    </button>
  </div>
</ion-content>

<ion-content
  *ngIf="!carregando && !aula"
  class="lesson-content lesson-empty"
>
  <p>
    Aula não encontrada ou ainda bloqueada.
  </p>
  <button
    type="button"
    class="nav-btn secondary"
    (click)="voltar()"
  >
    Voltar ao curso
  </button>
</ion-content>
